# Uber takes a commission (with GST on it) and pays the fleet weekly for online fares.
[[platforms]]
name = "Uber"
commission_pct = 25
commission_gst_pct = 18
tds_pct = 0.1
settles = true
# Namma Yatri takes no commission: the rider pays the driver or the fleet's QR, and the
# platform charges a flat fee per driver per day.
[[platforms]]
name = "Namma Yatri"
daily_fee = 25
settles = false

[energy]
cng_per_kg = 89
depot_per_kwh = 9
public_per_kwh = 21

[rules]
driver_share_pct = 35
max_shift_hours = 12
cash_tolerance = 100
personal_km_tolerance = 10
fuel_floor_pct = 80
cancel_pct = 20
papers_days = 15
