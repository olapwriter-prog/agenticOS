# A cafe in Visakhapatnam that sells noodles, fried rice and fried chicken on Swiggy, Zomato and
# WhatsApp Business. This file is the whole description of the shop: change it and the same
# code runs another business. The shop, its GSTIN and its people are made up; prices are
# estimates for a mid-range takeaway in the city, before GST.
name = "Vizag Wok & Crunch"
address = "Dwaraka Nagar, Visakhapatnam 530016"
city = "Visakhapatnam"
state = "Andhra Pradesh"
state_code = "37"
gstin = "37AAAAA0000A1Z5"
fssai = "10100000000000"
lat = 17.7285
lon = 83.3080

gst_scheme = "restaurant_5"     # 5% on food, no input tax credit. "regular_18" allows credit.
