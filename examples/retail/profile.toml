# A value-fashion store in a shopping centre in Visakhapatnam, about 5,000 bills a day. The store,
# its GSTIN and its suppliers are made up. Every rate and amount here is an assumption to be
# replaced with the real one: check the GST rates and dates against the current notifications.
name = "Vizag Value Fashion (CMR Central store)"
gstin = "37AABCV5555K1ZW"
state_code = "37"
invoice_prefix = "VVF/25-26/"
fy_start = "2025-04-01"
fy_end = "2026-03-31"
bills_per_day = 5000

# ---- GST on what is sold. A slab is on the value of one piece before tax. ----
# Clothing (HSN 61, 62, 63): 5% up to ₹1,000 and 12% above until 21 Sep 2025; from 22 Sep 2025
# 5% up to ₹2,500 and 18% above.
[[rate_rules]]
hsn = "61"
from = "2017-07-01"
to = "2025-09-21"
slab = 1000
low = 5
high = 12
[[rate_rules]]
