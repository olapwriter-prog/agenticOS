[package]
name = "agentd"
version.workspace = true
edition.workspace = true

[dependencies]
agentos-ledger = { path = "../ledger" }
agentos-hal = { path = "../hal" }
agentos-stage = { path = "../stage" }
agentos-kerneld = { path = "../kerneld" }
agentos-freeze = { path = "../freeze" }
agentos-power = { path = "../power" }
agentos-router = { path = "../router" }
agentos-action = { path = "../action" }
agentos-firewall = { path = "../firewall" }
agentos-gate = { path = "../gate" }
agentos-store = { path = "../store" }
agentos-brain = { path = "../brain" }
agentos-host = { path = "../host" }
agentos-executor = { path = "../executor" }
agentos-connectors = { path = "../connectors" }
agentos-intents = { path = "../intents" }
agentos-status = { path = "../status" }
agentos-notify = { path = "../notify" }
agentos-vault = { path = "../vault" }
agentos-gateway = { path = "../gateway" }
agentos-commercial = { path = "../commercial" }
agentos-update = { path = "../update" }
agentos-phone = { path = "../phone" }
agentos-prio = { path = "../prio" }
agentos-models = { path = "../models" }
agentos-functions = { path = "../functions" }
agentos-partner = { path = "../partner" }
agentos-screen = { path = "../screen" }
agentos-skillpack = { path = "../skillpack" }
agentos-docs = { path = "../docs" }
agentos-apps = { path = "../apps" }
agentos-learn = { path = "../learn" }
agentos-understand = { path = "../understand" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
getrandom = "0.2"
libc = "0.2"

# A stand-in for llama-server, used by the end-to-end tests (not installed by the package).
[[bin]]
name = "agentd-fake-llama"
path = "tests/support/fake_llama.rs"
test = false
