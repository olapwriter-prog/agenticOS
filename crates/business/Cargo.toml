[package]
name = "agentos-business"
version.workspace = true
edition.workspace = true
description = "A small business on the phone: orders from every channel, bills, GST, rider and platform settlement, next-day plan"

[dependencies]
agentos-executor = { path = "../executor" }
agentos-action = { path = "../action" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
