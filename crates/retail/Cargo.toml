[package]
name = "agentos-retail"
version.workspace = true
edition.workspace = true
description = "A retail store's books on the phone: every bill audited, GST returns, the year's tally and the income-tax computation"

[dependencies]
agentos-business = { path = "../business" }
agentos-executor = { path = "../executor" }
agentos-action = { path = "../action" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
