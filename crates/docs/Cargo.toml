[package]
name = "agentos-docs"
version.workspace = true
edition.workspace = true
description = "Reading Word, Excel, PowerPoint and PDF files on the phone, natively, as headless tools"

[dependencies]
agentos-action = { path = "../action" }
agentos-executor = { path = "../executor" }
agentos-screen = { path = "../screen" }
agentos-skillpack = { path = "../skillpack" }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
lopdf = "0.47"
