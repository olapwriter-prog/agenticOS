[package]
name = "agentos-apps"
version.workspace = true
edition.workspace = true
description = "Apps without app stores: weather, maps, currency, encyclopedia, dictionary, holidays, books, radio, podcasts, recipes, translation, crypto, over public APIs, shown as generated screens"

[dependencies]
agentos-action = { path = "../action" }
agentos-executor = { path = "../executor" }
agentos-screen = { path = "../screen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
