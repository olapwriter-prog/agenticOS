[package]
name = "agentos-script-guest"
version.workspace = true
edition.workspace = true

# Built for wasm32-unknown-unknown by crates/scripts/build.rs and run inside the sandbox.
# On the host it compiles to an empty library.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rhai = { version = "1", default-features = false, features = ["std", "no_time", "no_module", "serde"] }
serde_json = "1"
