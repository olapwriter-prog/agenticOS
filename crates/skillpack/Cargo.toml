[package]
name = "agentos-skillpack"
version.workspace = true
edition.workspace = true
description = "Agent Skills (SKILL.md) on the phone: imported with their licenses, searched, and cut to what a small model can hold"

[[bin]]
name = "agentos-skillpack"
path = "src/main.rs"

[dependencies]
agentos-action = { path = "../action" }
agentos-executor = { path = "../executor" }
agentos-screen = { path = "../screen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
