[package]
name = "agentos-partner"
version.workspace = true
edition.workspace = true
description = "The phone as a business partner and a personal assistant: channels, invoices and GST, payments, shopping, news and bookings"

[dependencies]
agentos-action = { path = "../action" }
agentos-executor = { path = "../executor" }
agentos-screen = { path = "../screen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
