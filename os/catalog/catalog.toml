# ---- agents: a named set of instructions with the tools it may use
[[item]]
id = "trip-planner"
name = "Trip planner"
kind = "agent"
publisher = "agenticOS"
category = "Agents"
summary = "Plans a trip: weather, directions, and events and reminders for the days."
mode = "Agent"
instructions = "You plan trips for the owner. Check the weather for the days, suggest the route, and add the days to the calendar. Ask before anything is booked."
tools = ["weather", "directions", "add_event", "set_reminder"]

[[item]]
