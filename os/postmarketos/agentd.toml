# agentd on a real phone (postmarketOS). See agentd.example.toml in the source for every key.
data_dir = "/var/lib/agentd"
control_socket = "/run/agentd.sock"
listen = "127.0.0.1:8765"         # MCP endpoint; reach it over SSH or USB networking, not the open net
allowed_origins = []

phone = "modemmanager"            # real modem, Wi-Fi, LEDs, vibration
leds_dir = "/sys/class/leds"
phone_poll_secs = 2

real_hardware = true              # real cgroup freezer and cpufreq governor
power_dir = "/sys/class/power_supply/battery"   # check: ls /sys/class/power_supply
kdf_mib = 64

commercial_enabled = false

# ---- the local LLM ------------------------------------------------------------------------
# agentd runs llama-server for each model itself, puts it in the model's cgroup and gives it the
# chip. Download the files once with:   agentd models pull -c /etc/agentd/agentd.toml
llama_server = "/usr/bin/llama-server"
keep_small_loaded = true          # always ready: about 3 GB of RAM held for the small model
model_wait_secs = 20
# reserve_cpus = [0]              # cores kept for calls and the system; default: the slowest core
hot_c = 80.0                      # drop the boost above this, restore below cool_c
cool_c = 70.0
coder_attempts = 3                # write -> test in the sandbox -> show the model what failed
coder_timeout_secs = 300

# Memory: the 4B needs about 3 GB and the 9B about 6 GB. Both are loaded only on the charger;
# on a phone with less than 12 GB of RAM, delete the 9B table (the 4B then does everything).

[[models]]                        # always loaded: chat, tool choice, small functions
name = "qwen3.5-4b"
role = "small"
file = "Qwen3.5-4B-Q4_K_M.gguf"
url = "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"
sha256 = "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4"
port = 8080
ctx = 8192
gpu_layers = 99                   # all layers on the GPU via Vulkan when there is one

[[models]]                        # on the charger: harder requests and writing functions
name = "qwen3.5-9b"
role = "large"
file = "Qwen3.5-9B-Q4_K_M.gguf"
url = "https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf"
sha256 = "03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8"
port = 8081
ctx = 8192
gpu_layers = 99
