# agentd on a real phone (postmarketOS). See agentd.example.toml in the source for every key.
data_dir = "/var/lib/agentd"
control_socket = "/run/agentd.sock"
listen = "127.0.0.1:8765"         # MCP endpoint; reach it over SSH or USB networking, not the open net
allowed_origins = []

phone = "modemmanager"            # real modem, Wi-Fi, LEDs, vibration
leds_dir = "/sys/class/leds"
phone_poll_secs = 2

real_hardware = true              # real cgroup freezer and cpufreq governor
power_dir = "/sys/class/power_supply/battery"   # check: ls /sys/class/power_supply
kdf_mib = 64

commercial_enabled = false

# ---- the local LLM ------------------------------------------------------------------------
# agentd runs llama-server for each model itself, puts it in the model's cgroup and gives it the
# chip. Download the files once with:   agentd models pull -c /etc/agentd/agentd.toml
llama_server = "/usr/bin/llama-server"
keep_small_loaded = true          # always ready: about 0.5 GB of RAM held for the small model
model_wait_secs = 20
# reserve_cpus = [0]              # cores kept for calls and the system; default: the slowest core
hot_c = 80.0                      # drop the boost above this, restore below cool_c
cool_c = 70.0

[[models]]                        # always loaded: answers chat
name = "qwen2.5-0.5b"
role = "small"
file = "qwen2.5-0.5b-instruct-q4_k_m.gguf"
